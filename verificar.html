<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Verificação de laudo · Exata Ambiental</title>
<style>
  :root{--r:#c00000;--ink:#1d1d1b;--mut:#6a6a66;--ln:#e6e3dc;--bg:#f4f3ef;--ok:#2f8f5b;--warn:#b8790f;}
  *{box-sizing:border-box;} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'IBM Plex Sans',system-ui,sans-serif;padding:16px;}
  .wrap{max-width:560px;margin:24px auto;} .top{background:var(--r);border-radius:14px 14px 0 0;padding:14px 20px;display:flex;align-items:center;gap:12px;}
  .top .logo{background:#fff;border-radius:8px;padding:6px 10px;display:flex;align-items:center;gap:10px;} .top img{height:24px;display:block;} .top span{color:#fff;font-weight:600;font-size:12px;letter-spacing:.06em;margin-left:auto;text-align:right;}
  .card{background:#fff;border:1px solid var(--ln);border-top:0;border-radius:0 0 14px 14px;padding:22px 22px 18px;}
  .sel{display:flex;gap:12px;align-items:center;margin-bottom:14px;} .sel i{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:24px;color:#fff;flex:none;}
  .sel h1{margin:0;font-size:20px;line-height:1.2;} .sel p{margin:2px 0 0;color:var(--mut);font-size:13px;}
  .ok i{background:var(--ok);} .exp i{background:var(--warn);} .no i{background:#8a8a85;}
  dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:8px;} dl div{background:#f7f5f1;border-radius:8px;padding:9px 12px;} dl .w{grid-column:span 2;} dt{font-size:10px;font-weight:600;letter-spacing:.07em;color:var(--mut);text-transform:uppercase;} dd{margin:1px 0 0;font-weight:600;}
  form{display:flex;gap:8px;margin-top:16px;} input{flex:1;padding:10px 12px;border:1px solid #cfcdc6;border-radius:8px;font:inherit;text-transform:uppercase;} button{background:var(--r);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;}
  .foot{color:var(--mut);font-size:12px;margin-top:14px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="logo"><img src="logo-mann.png" alt="MANN"><img src="logo-exata.png" alt="EXATA"></div><span>VERIFICAÇÃO DE<br>LAUDO TÉCNICO</span></div>
  <div class="card"><div id="res"><p style="color:#6a6a66">Consultando…</p></div>
    <form id="f"><input id="cod" placeholder="Código de verificação" maxlength="20" autocomplete="off"><button>Verificar</button></form>
    <p class="foot">Exata Ambiental · (41) 3107-1515 · manngroup.com.br</p></div>
</div>
<script>
const SB = 'https://vjbyyjfmilmeyzeiinxf.supabase.co', KEY = 'sb_publishable_HgnI-KSEvq1PJet6fmrV_g_MRf6HK4M';
const TIPOS = { desinsetizacao:'Desinsetização', desinsetizacao_caixa:'Desinsetização + higienização de reservatório', caixa_dedetizacao:'Higienização de reservatório + dedetização', desratizacao:'Desratização', veiculo:'Dedetização de veículo' };
const d = s => s ? String(s).slice(8,10) + '/' + String(s).slice(5,7) + '/' + String(s).slice(0,4) : '–';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function verificar(cod){
  const box = document.getElementById('res'); cod = String(cod || '').trim();
  if(!cod){ box.innerHTML = '<div class="sel no"><i>?</i><div><h1>Informe o código</h1><p>O código está impresso no rodapé do laudo, junto ao QR code.</p></div></div>'; return; }
  box.innerHTML = '<p style="color:#6a6a66">Consultando…</p>';
  try{
    const r = await fetch(SB + '/rest/v1/rpc/laudo_verificar', { method:'POST', headers:{ apikey:KEY, 'Content-Type':'application/json' }, body: JSON.stringify({ p_codigo: cod }) });
    const l = await r.json();
    if(!r.ok) throw new Error('falha na consulta');
    if(!l || l.numero == null){ box.innerHTML = '<div class="sel no"><i>✕</i><div><h1>Laudo não encontrado</h1><p>Confira o código impresso no laudo. Se continuar sem resultado, entre em contato com a Exata Ambiental.</p></div></div>'; return; }
    const hoje = new Date().toISOString().slice(0,10), venc = l.validade && l.validade < hoje, rasc = l.status === 'rascunho';
    const cab = rasc ? ['no','!','Documento ainda não emitido','Este laudo está registrado como rascunho e não vale como certificado.'] : venc ? ['exp','!','Laudo autêntico, com validade encerrada','Documento emitido pela Exata Ambiental, porém vencido em ' + d(l.validade) + '.'] : ['ok','✓','Laudo autêntico e válido','Documento emitido pela Exata Ambiental e dentro da validade.'];
    box.innerHTML = `<div class="sel ${cab[0]}"><i>${cab[1]}</i><div><h1>${cab[2]}</h1><p>${cab[3]}</p></div></div>
      <dl><div><dt>Laudo nº</dt><dd>${esc(l.numero)}</dd></div><div><dt>Data da execução</dt><dd>${d(l.data)}</dd></div><div class="w"><dt>Serviço</dt><dd>${esc(TIPOS[l.tipo] || l.tipo)}</dd></div>
      <div class="w"><dt>Contratante</dt><dd>${esc(l.cliente)}${l.cnpj ? ' · ' + esc(l.cnpj) : ''}</dd></div><div><dt>Válido até</dt><dd>${d(l.validade)}</dd></div><div><dt>Emitido por</dt><dd>${esc(l.emissor)}</dd></div></dl>`;
  }catch(e){ box.innerHTML = '<div class="sel no"><i>!</i><div><h1>Não foi possível consultar agora</h1><p>Tente novamente em instantes.</p></div></div>'; }
}
document.getElementById('f').onsubmit = e => { e.preventDefault(); const c = document.getElementById('cod').value; history.replaceState(null, '', '?c=' + encodeURIComponent(c)); verificar(c); };
const c0 = new URLSearchParams(location.search).get('c'); if(c0) document.getElementById('cod').value = c0; verificar(c0);
</script>
</body>
</html>
